<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alibi Analyzer | Clean Output</title>
    <style>
        :root {
            --bg: #0f0f13;
            --panel: #1a1a22;
            --text: #e0e0e0;
            --accent: #8c64ff;
            --danger: #ff4d4d;
            --success: #4dff88;
            --warning: #ffcc00;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: var(--panel);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        h1 { color: var(--accent); margin-top: 0; text-align: center; }
        .upload-area {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 20px;
        }
        .file-box {
            flex: 1;
            border: 2px dashed #444;
            border-radius: 8px;
            padding: 20px 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            background: #111;
        }
        .file-box:hover, .file-box.dragover {
            border-color: var(--accent);
            background: rgba(140, 100, 255, 0.1);
        }
        .file-box.loaded { border-color: var(--success); }
        .file-name { font-size: 12px; color: var(--success); margin-top: 5px; word-break: break-all;}
        
        .result-box {
            background: #111;
            border-radius: 8px;
            padding: 15px;
            display: none;
            margin-top: 20px;
        }
        .verdict {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 6px;
        }
        .v-clean { color: var(--success); background: rgba(77, 255, 136, 0.1); border: 1px solid var(--success); }
        .v-detected { color: var(--danger); background: rgba(255, 77, 77, 0.2); border: 2px solid var(--danger); }
        
        /* Блок с уликами */
        .evidence-box {
            background: #1a1a22;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            border-left: 4px solid var(--danger);
        }
        .evidence-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--danger);
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .cheat-card {
            background: #111;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 4px;
            border: 1px solid #333;
        }
        .cheat-name { color: #ff8888; font-weight: bold; font-size: 15px; margin-bottom: 4px; }
        .cheat-path { color: #aaa; font-size: 12px; word-break: break-all; }
        
        /* Сырой лог */
        .raw-log-toggle {
            background: #333; color: white; border: none; padding: 10px;
            width: 100%; text-align: left; cursor: pointer; border-radius: 4px;
            margin-bottom: 10px; font-weight: bold;
        }
        .raw-log-toggle:hover { background: #444; }
        
        .logs { font-family: monospace; font-size: 13px; max-height: 400px; overflow-y: auto; display: none; background: #000; padding: 10px; border-radius: 4px;}
        .log-entry { padding: 4px; border-bottom: 1px solid #222; color: #888; }
        
        button {
            background: var(--accent); color: white; border: none; padding: 12px 20px;
            border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 15px;
            width: 100%;
        }
        button:hover { opacity: 0.8; }
        button:disabled { background: #333; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Alibi Compact Analyzer</h1>
        <p style="text-align: center; color: #888;">Выводит только список найденных файлов (AHK, Cheat, DMA).</p>
        
        <div class="upload-area">
            <div class="file-box" id="box1" onclick="document.getElementById('file1').click()">
                <div>Файл 1 (PC Report)</div>
                <div class="file-name" id="name1"></div>
                <input type="file" id="file1" style="display: none;" accept=".txt">
            </div>
            <div class="file-box" id="box2" onclick="document.getElementById('file2').click()">
                <div>Файл 2 (Input Devices)</div>
                <div class="file-name" id="name2"></div>
                <input type="file" id="file2" style="display: none;" accept=".txt">
            </div>
        </div>

        <button id="analyzeBtn" disabled onclick="runAnalysis()">Анализировать</button>

        <div class="result-box" id="resultBox">
            <div class="verdict" id="verdict">Ожидание...</div>
            
            <div class="evidence-box" id="evidenceBox" style="display: none;">
                <div class="evidence-title">Найденные файлы и артефакты:</div>
                <div id="cheatList"></div>
            </div>

            <button class="raw-log-toggle" id="rawBtn" style="display: none;" onclick="toggleRawLog()">Показать полный отчет (сырой текст)</button>
            <div class="logs" id="logs"></div>
        </div>
    </div>

    <script>
        let file1Content = null;
        let file2Content = null;
        const analyzeBtn = document.getElementById('analyzeBtn');

        setupDropZone('box1', 'file1', 'name1', (content, name) => {
            file1Content = content;
            document.getElementById('name1').textContent = name;
            document.getElementById('box1').classList.add('loaded');
            if (file2Content) analyzeBtn.disabled = false;
        });

        setupDropZone('box2', 'file2', 'name2', (content, name) => {
            file2Content = content;
            document.getElementById('name2').textContent = name;
            document.getElementById('box2').classList.add('loaded');
            if (file1Content) analyzeBtn.disabled = false;
        });

        function setupDropZone(boxId, inputId, nameId, callback) {
            const box = document.getElementById(boxId);
            const input = document.getElementById(inputId);
            input.addEventListener('change', (e) => {
                if (e.target.files.length) {
                    const reader = new FileReader();
                    reader.onload = (ev) => callback(ev.target.result, e.target.files[0].name);
                    reader.readAsText(e.target.files[0]);
                }
            });
            box.addEventListener('dragover', (e) => { e.preventDefault(); box.classList.add('dragover'); });
            box.addEventListener('dragleave', () => box.classList.remove('dragover'));
            box.addEventListener('drop', (e) => {
                e.preventDefault(); box.classList.remove('dragover');
                if (e.dataTransfer.files.length) {
                    const reader = new FileReader();
                    reader.onload = (ev) => callback(ev.target.result, e.dataTransfer.files[0].name);
                    reader.readAsText(e.dataTransfer.files[0]);
                }
            });
        }

        function runAnalysis() {
            const resultBox = document.getElementById('resultBox');
            const verdictEl = document.getElementById('verdict');
            const evidenceBox = document.getElementById('evidenceBox');
            const cheatList = document.getElementById('cheatList');
            const rawBtn = document.getElementById('rawBtn');
            const logsEl = document.getElementById('logs');
            
            resultBox.style.display = 'block';
            evidenceBox.style.display = 'none';
            rawBtn.style.display = 'block';
            logsEl.innerHTML = '';
            cheatList.innerHTML = '';
            
            const fullText = (file1Content + "\n" + file2Content);
            
            // 1. Проверяем вердикт
            let isDetected = false;
            if (fullText.includes("CHEATS DETECTED") || fullText.includes("MITM CHEAT STACK DETECTED")) {
                verdictEl.textContent = "ЧЕЛОВЕК - ЧИТЕР";
                verdictEl.className = 'verdict v-detected';
                isDetected = true;
            } else {
                verdictEl.textContent = "ЧИСТО";
                verdictEl.className = 'verdict v-clean';
            }

            // 2. Ищем улики (файлы)
            let uniqueCheats = [];
            const seen = new Set();
            const lines = fullText.split('\n');

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                
                // Ищем начало блока с читом
                if (line.includes("[HIGH/cheat]")) {
                    let file = "Неизвестный файл";
                    let path = "";

                    // Смотрим следующие 10 строк после триггера
                    for (let j = i; j < i + 10 && j < lines.length; j++) {
                        let current = lines[j].trim();
                        
                        // Ищем имя файла
                        let nameMatch = current.match(/FileName:\s*(.*)/i);
                        if (nameMatch) {
                            file = nameMatch[1].trim();
                        }
                        
                        // Ищем путь
                        let pathMatch = current.match(/FullPath:\s*(.*)/i);
                        if (pathMatch) {
                            path = pathMatch[1].trim();
                            break; // Как только нашли путь, дальше блок не читаем
                        }
                    }

                    // Если не нашли через FileName, пробуем вытащить из строки триггера
                    if (file === "Неизвестный файл" && line.includes("~\\Desktop")) {
                        let parts = line.split("~\\Desktop");
                        if (parts.length > 1) {
                            file = parts[1].split("-")[0].trim();
                            path = "~\\Desktop" + file;
                        }
                    }

                    if (file !== "Неизвестный файл") {
                        const key = file + path;
                        if (!seen.has(key)) {
                            seen.add(key);
                            uniqueCheats.push({ file, path });
                        }
                    }
                }
            }

            // Выводим улики вверх
            if (uniqueCheats.length > 0) {
                evidenceBox.style.display = 'block';
                uniqueCheats.forEach(cheat => {
                    const div = document.createElement('div');
                    div.className = 'cheat-card';
                    
                    let html = `<div class="cheat-name">📄 ${cheat.file}</div>`;
                    if (cheat.path) html += `<div class="cheat-path">Путь: ${cheat.path}</div>`;
                    
                    div.innerHTML = html;
                    cheatList.appendChild(div);
                });
            } else if (isDetected) {
                // Если вердикт читер, но файлы не найдены (например, DMA)
                evidenceBox.style.display = 'block';
                cheatList.innerHTML = '<div style="color: var(--warning);">Вердикт: Читер (но названия файлов скрыты, возможно DMA)</div>';
            }

            // 3. Записываем сырой лог вниз (скрытый)
            lines.forEach(line => {
                if (!line.trim()) return;
                const div = document.createElement('div');
                div.className = 'log-entry';
                div.textContent = line.trim();
                logsEl.appendChild(div);
            });
        }

        function toggleRawLog() {
            const logs = document.getElementById('logs');
            const btn = document.getElementById('rawBtn');
            if (logs.style.display === 'block') {
                logs.style.display = 'none';
                btn.textContent = 'Показать полный отчет (сырой текст)';
            } else {
                logs.style.display = 'block';
                btn.textContent = 'Скрыть полный отчет';
            }
        }
    </script>
</body>
</html>
